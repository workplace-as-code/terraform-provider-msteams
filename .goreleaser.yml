# GoReleaser configuration following the Terraform Registry publishing requirements:
# https://developer.hashicorp.com/terraform/registry/providers/publishing
# The PowerShell bridge scripts are embedded in the binary (see bridge/embed.go),
# so the archive only needs the provider executable.
version: 2

# The registry requires archives named terraform-provider-<name>_<version>_<os>_<arch>.zip,
# so the project name must not depend on the local folder name.
project_name: terraform-provider-msteams

before:
  hooks:
    - go mod tidy

builds:
  - env:
      - CGO_ENABLED=0
    mod_timestamp: '{{ .CommitTimestamp }}'
    flags:
      - -trimpath
    ldflags:
      - '-s -w -X main.version={{ .Version }}'
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    binary: '{{ .ProjectName }}_v{{ .Version }}'

archives:
  - formats: [zip]
    name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}'

checksum:
  extra_files:
    - glob: 'terraform-registry-manifest.json'
      name_template: '{{ .ProjectName }}_{{ .Version }}_manifest.json'
  name_template: '{{ .ProjectName }}_{{ .Version }}_SHA256SUMS'
  algorithm: sha256

signs:
  - artifacts: checksum
    args:
      - "--batch"
      - "--local-user"
      - "{{ .Env.GPG_FINGERPRINT }}"
      - "--output"
      - "${signature}"
      - "--detach-sign"
      - "${artifact}"

release:
  extra_files:
    - glob: 'terraform-registry-manifest.json'
      name_template: '{{ .ProjectName }}_{{ .Version }}_manifest.json'

# Release notes, generated from the commits since the previous tag. Pull requests
# are squash-merged, so each commit title is a pull request title, which the PR
# title workflow keeps in Conventional Commits form.
changelog:
  use: github
  # One line per pull request: its title, which ends with the PR number (#n)
  format: '{{ .Message }}'
  groups:
    - title: Features
      regexp: '^feat(\(.+\))?!?:'
      order: 0
    - title: Bug fixes
      regexp: '^fix(\(.+\))?!?:'
      order: 1
    - title: Documentation
      regexp: '^docs(\(.+\))?!?:'
      order: 2
    - title: Other changes
      order: 999
  filters:
    # Release commits, CI and tests change nothing for users
    exclude:
      - '^release(\(.+\))?!?:'
      - '^ci(\(.+\))?!?:'
      - '^test(\(.+\))?!?:'
